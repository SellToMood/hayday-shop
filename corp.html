<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Hay Day Item Order System</title>
  <style>
    /* กำหนดขนาดกริ็ดสไปรท์ (ตัวอย่าง 32x32px) */
    .item-icon {
      width: 32px;
      height: 32px;
      display: inline-block;
      background-repeat: no-repeat;
    }
    
    /* สไตล์ Modal สำหรับยืนยันออเดอร์ */
    .modal {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #fff;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
      border-radius: 8px;
    }
    .modal.active { display: block; }
  </style>
</head>
<body>

  <h2>รายการสินค้า</h2>
  <div id="item-list"></div>

  <button onclick="openOrderModal()">สั่งออเดอร์</button>

  <!-- Modal สำหรับยืนยันออเดอร์ และกรอก Tag -->
  <div id="order-modal" class="modal">
    <h3>ยืนยันการสั่งซื้อ</h3>
    <label for="tag-input">ระบุ Tag / ชื่อผู้สั่ง:</label>
    <input type="text" id="tag-input" placeholder="เช่น #TAG1234 หรือ Name" required>
    <br><br>
    <button onclick="confirmOrder()">ยืนยันสั่งออเดอร์</button>
    <button onclick="closeOrderModal()">ยกเลิก</button>
  </div>

  <script>
    // ตัวอย่าง itemsData สำหรับทดสอบ (ใช้สลับภาพตามหมวดหมู่)
    const itemsData = [
      { id: 1, name: "ไข่ไก่", level: 1, category: "crops", col: 0, row: 0 },
      { id: 2, name: "ขนมปัง", level: 2, category: "bakery", col: 1, row: 0 },
      { id: 3, name: "นมสด", level: 6, category: "crops", col: 2, row: 0 },
      { id: 4, name: "ครีม", level: 6, category: "bakery", col: 3, row: 0 }
    ];

    const ICON_SIZE = 32; // ขนาดของไอคอนแต่ละรูปใน Sprite Sheet (px)

    // ฟังก์ชันสร้าง UI แสดงผลรายการไอเทม
    function renderItems() {
      const container = document.getElementById("item-list");
      container.innerHTML = "";

      itemsData.forEach(item => {
        // เลือกไฟล์ภาพตาม category
        const spriteImage = item.category === "crops" ? "crop.png" : "food.png";
        
        // คำนวณตำแหน่ง Background Offset ใน Sprite
        const bgPosX = -(item.col * ICON_SIZE);
        const bgPosY = -(item.row * ICON_SIZE);

        const div = document.createElement("div");
        div.style.margin = "5px";
        div.innerHTML = `
          <span class="item-icon" style="background-image: url('${spriteImage}'); background-position: ${bgPosX}px ${bgPosY}px;"></span>
          <span>${item.name} (Lv. ${item.level})</span>
        `;
        container.appendChild(div);
      });
    }

    // ฟังก์ชันเปิด-ปิด Modal
    function openOrderModal() {
      document.getElementById("order-modal").classList.add("active");
    }

    function closeOrderModal() {
      document.getElementById("order-modal").classList.remove("active");
    }

    // ฟังก์ชันตรวจสอบการกรอก Tag และยืนยันออเดอร์
    function confirmOrder() {
      const tagValue = document.getElementById("tag-input").value.trim();

      if (!tagValue) {
        alert("กรุณากรอก Tag ก่อนกดยืนยันสั่งออเดอร์ครับ!");
        return;
      }

      // ประมวลผลส่งออเดอร์พร้อม Tag
      console.log("ส่งออเดอร์เรียบร้อย!", {
        tag: tagValue,
        items: itemsData
      });

      alert(`บันทึกออเดอร์สำหรับ Tag: ${tagValue} เรียบร้อยแล้ว`);
      
      // ล้างค่าและปิด Modal
      document.getElementById("tag-input").value = "";
      closeOrderModal();
    }

    // แสดงผลไอเทมเมื่อโหลดหน้าเว็บ
    renderItems();
  </script>
</body>
</html>
