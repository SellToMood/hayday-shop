<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สั่งซื้อของอัปเกรด - Hay Day</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Kanit', sans-serif; }
    body { background-color: #f4f6f8; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 500px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #333; margin-top: 0; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; }
    select, input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; outline: none; }
    .item-inputs { background: #eef2f5; padding: 10px; border-radius: 8px; margin-top: 10px; }
    .btn-submit { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 15px; transition: all 0.2s; }
    .price-box { font-size: 18px; font-weight: bold; color: #d9534f; text-align: center; margin-top: 15px; }

    /* Modal Popup Styles */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
    .modal-content { background: #ffffff; width: 100%; max-width: 450px; border-radius: 16px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    .btn-confirm { width: 100%; background: #22c55e; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 15px; }

    /* Order Result Box Style */
    .order-result-box { background: #f0fdf4; border: 2px dashed #22c55e; border-radius: 12px; padding: 15px; text-align: center; margin: 15px 0; }
    .order-id-display { font-size: 22px; font-weight: bold; color: #16a34a; letter-spacing: 1px; margin-bottom: 8px; }
    .btn-copy { background: #0284c7; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px; }
  </style>
</head>
<body>

<div class="container">
  <h2>🚜 สั่งซื้อไอเทมอัปเกรด</h2>

  <div class="form-group">
    <label>1. เลือกหมวดอัปเกรด</label>
    <select id="category" onchange="updateOptions()">
      <option value="barn">อัปโรงนา (ไม้กระดาน, เทป, สลัก)</option>
      <option value="silo">อัปยุ้งฉาง (สกรู, ไม้ฝา, ตะปู)</option>
      <option value="land">ขยายพื้นที่ (หมุด, โฉนด, ค้อน)</option>
    </select>
  </div>

  <div class="form-group">
    <label>2. เลือกรูปแบบสั่งซื้อ</label>
    <select id="buyType" onchange="updateOptions()">
      <option value="mix">แบบคละ 89 ชิ้น (ระบบคละให้)</option>
      <option value="custom">แบบเลือกเอง (รวมครบ 89 ชิ้น) - 15 บาท</option>
      <option value="single">แบบล้วนชนิดเดียว - 20 บาท</option>
    </select>
  </div>

  <div id="dynamicInputs" class="item-inputs"></div>

  <div class="form-group" style="margin-top:15px;">
    <label>Tag ในเกม / ชื่อในเกม</label>
    <input type="text" id="playerTag" placeholder="เช่น #12345678">
  </div>

  <div class="price-box" id="totalPrice">ราคารวม: 10 บาท</div>

  <button class="btn-submit" onclick="submitOrder()">ส่งออเดอร์</button>
</div>

<!-- Modal: ป๊อปอัปแจ้งผลออเดอร์ + ปุ่มกดคัดลอก -->
<div class="modal-overlay" id="successOrderModal">
  <div class="modal-content" style="text-align: center;">
    <h3 style="margin:0; color:#16a34a;">🎉 สั่งซื้อสำเร็จ!</h3>
    <p style="font-size:14px; color:#64748b; margin-top:6px;">กรุณากดคัดลอกเลขออเดอร์เพื่อแจ้งแอดมิน</p>
    
    <div class="order-result-box">
      <div class="order-id-display" id="displayOrderId">#UP-0000</div>
      <button class="btn-copy" id="btnCopyOrder" onclick="copyOrderId()">📋 คัดลอกเลขออเดอร์</button>
    </div>

    <button class="btn-confirm" onclick="closeSuccessModal()">เรียบร้อย</button>
  </div>
</div>

<script>
  const categories = {
    barn: { name: "อัปโรงนา", items: ["ไม้กระดาน", "เทป", "สลัก"], mixPrice: 10 },
    silo: { name: "อัปยุ้งฉาง", items: ["สกรู", "ไม้ฝา", "ตะปู"], mixPrice: 10 },
    land: { name: "ขยายพื้นที่", items: ["หมุด", "โฉนด", "ค้อน"], mixPrice: 12 }
  };

  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzgp3FtmPRryzLiKuGqL61Pwlf27Xf7QugR5qv7SltoPo5I5RjojXmHu6AHyMa3EMpI/exec';
  let currentOrderId = '';

  function updateOptions() {
    const catKey = document.getElementById('category').value;
    const buyType = document.getElementById('buyType').value;
    const cat = categories[catKey];
    const container = document.getElementById('dynamicInputs');
    let html = '';
    let price = 0;

    if (buyType === 'mix') {
      price = cat.mixPrice;
      html = `<p style="margin:5px 0;"><b>รายละเอียด:</b> ระบบจะจัดคละไอเทม (${cat.items.join(', ')}) ให้รวมครบ 89 ชิ้น</p>`;
    } 
    else if (buyType === 'custom') {
      price = 15;
      html = `<p style="margin:5px 0 10px 0;"><b>กำหนดจำนวนเอง (รวมกันต้องได้ 89 ชิ้น):</b></p>`;
      cat.items.forEach((item, idx) => {
        html += `<div style="margin-bottom:8px;"><label>${item}: </label><input type="number" id="item_${idx}" value="0" min="0" oninput="calculateCustom()" style="padding:6px;"></div>`;
      });
      html += `<p id="customCount" style="color:red; font-weight:bold; margin-top:5px;">รวมปัจจุบัน: 0 / 89 ชิ้น</p>`;
    } 
    else if (buyType === 'single') {
      price = 20;
      html = `<p style="margin:5px 0 8px 0;"><b>เลือกไอเทมล้วน (89 ชิ้น):</b></p>`;
      html += `<select id="singleItemSelect">`;
      cat.items.forEach(item => {
        html += `<option value="${item}">${item} ล้วน</option>`;
      });
      html += `</select>`;
    }

    container.innerHTML = html;
    document.getElementById('totalPrice').innerText = `ราคารวม: ${price} บาท`;
  }

  function calculateCustom() {
    const catKey = document.getElementById('category').value;
    const cat = categories[catKey];
    let totalQty = 0;
    cat.items.forEach((_, idx) => {
      const val = parseInt(document.getElementById(`item_${idx}`)?.value || 0);
      totalQty += (isNaN(val) ? 0 : val);
    });
    const countText = document.getElementById('customCount');
    if (countText) {
      countText.innerText = `รวมปัจจุบัน: ${totalQty} / 89 ชิ้น`;
      countText.style.color = (totalQty === 89) ? 'green' : 'red';
    }
  }

  function submitOrder() {
    const btn = document.querySelector('.btn-submit');
    const catKey = document.getElementById('category').value;
    const buyType = document.getElementById('buyType').value;
    const tagInput = document.getElementById('playerTag');
    const tag = tagInput.value.trim();
    const cat = categories[catKey];

    if (!tag) {
      alert('กรุณากรอก Tag ในเกมด้วยครับ');
      tagInput.focus();
      return;
    }

    let itemsDetail = '';
    let price = 0;

    if (buyType === 'mix') {
      price = cat.mixPrice;
      itemsDetail = `${cat.name} (คละ 89 ชิ้น)`;
    } 
    else if (buyType === 'custom') {
      price = 15;
      let totalQty = 0;
      let details = [];
      cat.items.forEach((item, idx) => {
        const qty = parseInt(document.getElementById(`item_${idx}`)?.value || 0);
        if (!isNaN(qty) && qty > 0) {
          totalQty += qty;
          details.push(`${item} x${qty}`);
        }
      });

      if (totalQty !== 89) {
        alert('จำนวนไอเทมรวมกันต้องเท่ากับ 89 ชิ้นพอดีครับ! (ตอนนี้ได้ ' + totalQty + ' ชิ้น)');
        return;
      }
      itemsDetail = `${cat.name} (เลือกเอง):\n` + details.join('\n');
    } 
    else if (buyType === 'single') {
      price = 20;
      const selectedItem = document.getElementById('singleItemSelect').value;
      itemsDetail = `${cat.name} (${selectedItem} ล้วน 89 ชิ้น)`;
    }

    btn.disabled = true;
    const originalBtnText = btn.innerText;
    btn.innerText = '⏳ กำลังส่งออเดอร์...';
    btn.style.backgroundColor = '#6c757d';

    currentOrderId = '#UP-' + Math.floor(1000 + Math.random() * 9000);

    const orderData = {
      orderId: currentOrderId,
      tag: tag,
      items: itemsDetail,
      total: price
    };

    fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(orderData)
    })
    .then(() => {
      setTimeout(() => {
        // แสดง Modal ความสำเร็จ
        document.getElementById('displayOrderId').innerText = currentOrderId;
        document.getElementById('successOrderModal').style.display = 'flex';

        // รีเซ็ตฟอร์ม
        tagInput.value = '';
        updateOptions();

        btn.disabled = false;
        btn.innerText = originalBtnText;
        btn.style.backgroundColor = '#28a745';
      }, 1000);
    })
    .catch(err => {
      alert('เกิดข้อผิดพลาด: ' + err);
      btn.disabled = false;
      btn.innerText = originalBtnText;
      btn.style.backgroundColor = '#28a745';
    });
  }

  function copyOrderId() {
    navigator.clipboard.writeText(currentOrderId).then(() => {
      const btn = document.getElementById('btnCopyOrder');
      btn.innerText = '✅ คัดลอกสำเร็จ!';
      btn.style.background = '#22c55e';
      
      setTimeout(() => {
        btn.innerText = '📋 คัดลอกเลขออเดอร์';
        btn.style.background = '#0284c7';
      }, 2000);
    }).catch(err => {
      alert('ไม่สามารถคัดลอกได้อัตโนมัติ: ' + currentOrderId);
    });
  }

  function closeSuccessModal() {
    document.getElementById('successOrderModal').style.display = 'none';
  }

  updateOptions();
</script>

</body>
</html>
