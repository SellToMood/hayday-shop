<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สั่งซื้อของอัปเกรด - Hay Day</title>
  <style>
    body { font-family: 'Kanit', sans-serif; background-color: #f4f6f8; margin: 0; padding: 20px; }
    .container { max-width: 500px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #333; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; }
    select, input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    .item-inputs { background: #eef2f5; padding: 10px; border-radius: 8px; margin-top: 10px; }
    .btn-submit { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 15px; }
    .price-box { font-size: 18px; font-weight: bold; color: #d9534f; text-align: center; margin-top: 15px; }
  </style>
</head>
<body>

<div class="container">
  <h2>🚜 สั่งซื้อไอเทมอัปเกรด</h2>

  <div class="form-group">
    <label>1. เลือกหมวดอัปเกรด</label>
    <select id="category" onchange="updateOptions()">
      <option value="barn">อัปโรงนา (ไม้กระดาน, เทป, สลัก)</option>
      <option value="silo">อัปยุ้งฉาง (สกรู, ไม้ฝา, ตะปู)</option>
      <option value="land">ขยายพื้นที่ (หมุด, โฉนด, ค้อน)</option>
    </select>
  </div>

  <div class="form-group">
    <label>2. เลือกรูปแบบสั่งซื้อ</label>
    <select id="buyType" onchange="updateOptions()">
      <option value="mix">แบบคละ 89 ชิ้น (ระบบคละให้)</option>
      <option value="custom">แบบเลือกเอง (รวมครบ 89 ชิ้น) - 15 บาท</option>
      <option value="single">แบบล้วนชนิดเดียว - 20 บาท</option>
    </select>
  </div>

  <div id="dynamicInputs" class="item-inputs"></div>

  <div class="form-group" style="margin-top:15px;">
    <label>Tag ในเกม / ชื่อในเกม</label>
    <input type="text" id="playerTag" placeholder="เช่น #12345678">
  </div>

  <div class="price-box" id="totalPrice">ราคารวม: 10 บาท</div>

  <button class="btn-submit" onclick="submitOrder()">ส่งออเดอร์</button>
</div>

<script>
  // โครงสร้างข้อมูลไอเทมและราคา
  const categories = {
    barn: { name: "อัปโรงนา", items: ["ไม้กระดาน", "เทป", "สลัก"], mixPrice: 10 },
    silo: { name: "อัปยุ้งฉาง", items: ["สกรู", "ไม้ฝา", "ตะปู"], mixPrice: 10 },
    land: { name: "ขยายพื้นที่", items: ["หมุด", "โฉนด", "ค้อน"], mixPrice: 12 }
  };

  // WEB_APP_URL ของ Google Apps Script เดิมที่คุณตั้งค่าไว้
  const SCRIPT_URL = 'https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec';

  function updateOptions() {
    const catKey = document.getElementById('category').value;
    const buyType = document.getElementById('buyType').value;
    const cat = categories[catKey];
    const container = document.getElementById('dynamicInputs');
    let html = '';
    let price = 0;

    if (buyType === 'mix') {
      price = cat.mixPrice;
      html = `<p><b>รายละเอียด:</b> ระบบจะจัดคละไอเทม (${cat.items.join(', ')}) ให้รวมครบ 89 ชิ้น</p>`;
    } 
    else if (buyType === 'custom') {
      price = 15;
      html = `<p><b>กำหนดจำนวนเอง (รวมกันต้องได้ 89 ชิ้น):</b></p>`;
      cat.items.forEach((item, idx) => {
        html += `<label>${item}: <input type="number" id="item_${idx}" value="0" min="0" onchange="calculateCustom()"></label><br>`;
      });
      html += `<p id="customCount" style="color:blue;">รวมปัจจุบัน: 0 / 89 ชิ้น</p>`;
    } 
    else if (buyType === 'single') {
      price = 20;
      html = `<p><b>เลือกไอเทมล้วน (89 ชิ้น):</b></p>`;
      html += `<select id="singleItemSelect">`;
      cat.items.forEach(item => {
        html += `<option value="${item}">${item} ล้วน</option>`;
      });
      html += `</select>`;
    }

    container.innerHTML = html;
    document.getElementById('totalPrice').innerText = `ราคารวม: ${price} บาท`;
  }

  function calculateCustom() {
    const catKey = document.getElementById('category').value;
    const cat = categories[catKey];
    let totalQty = 0;
    cat.items.forEach((_, idx) => {
      const val = parseInt(document.getElementById(`item_${idx}`)?.value || 0);
      totalQty += val;
    });
    const countText = document.getElementById('customCount');
    if (countText) {
      countText.innerText = `รวมปัจจุบัน: ${totalQty} / 89 ชิ้น`;
      countText.style.color = (totalQty === 89) ? 'green' : 'red';
    }
  }

  function submitOrder() {
    const catKey = document.getElementById('category').value;
    const buyType = document.getElementById('buyType').value;
    const tag = document.getElementById('playerTag').value;
    const cat = categories[catKey];

    if (!tag) {
      alert('กรุณากรอก Tag ในเกมด้วยครับ');
      return;
    }

    let itemsDetail = '';
    let price = 0;

    if (buyType === 'mix') {
      price = cat.mixPrice;
      itemsDetail = `${cat.name} (คละ 89 ชิ้น)`;
    } 
    else if (buyType === 'custom') {
      price = 15;
      let totalQty = 0;
      let details = [];
      cat.items.forEach((item, idx) => {
        const qty = parseInt(document.getElementById(`item_${idx}`)?.value || 0);
        totalQty += qty;
        if (qty > 0) details.push(`${item} x${qty}`);
      });

      if (totalQty !== 89) {
        alert('จำนวนไอเทมรวมกันต้องเท่ากับ 89 ชิ้นพอดีครับ!');
        return;
      }
      itemsDetail = `${cat.name} (เลือกเอง):\n` + details.join('\n');
    } 
    else if (buyType === 'single') {
      price = 20;
      const selectedItem = document.getElementById('singleItemSelect').value;
      itemsDetail = `${cat.name} (${selectedItem} ล้วน 89 ชิ้น)`;
    }

    const orderData = {
      orderId: '#UP-' + Math.floor(1000 + Math.random() * 9000),
      tag: tag,
      items: itemsDetail,
      total: price
    };

    fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify(orderData)
    })
    .then(() => {
      alert('สั่งซื้อสำเร็จ! ออเดอร์ถูกส่งเรียบร้อยแล้ว');
    })
    .catch(err => alert('เกิดข้อผิดพลาด: ' + err));
  }

  // เรียกใช้ครั้งแรกเมื่อโหลดหน้า
  updateOptions();
</script>

</body>
</html>
