<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ร้านขายขนม Hay Day</title>
    <style>
        body { font-family: 'Tahoma', sans-serif; background-color: #f4ece1; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #5c3d2e; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #7f5539; font-size: 14px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .price-box { background-color: #e8f5e9; border: 1px solid #a5d6a7; padding: 12px; border-radius: 6px; text-align: center; margin-bottom: 15px; }
        .price-title { font-size: 14px; color: #2e7d32; }
        .price-amount { font-size: 22px; font-weight: bold; color: #1b5e20; }
        button { width: 100%; padding: 12px; background-color: #4CAF50; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; }
        button:disabled { background-color: #ccc; }
        .note { font-size: 12px; color: #d32f2f; margin-top: 4px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🌾 ร้านสั่งขนม Hay Day 🍞</h2>
    <div class="subtitle">ขั้นต่ำ 10 ชิ้น (2 บาท) / 100 ชิ้น (12 บาท)</div>

    <form id="orderForm">
        <div class="form-group">
            <label>ชื่อผู้สั่ง / ชื่อฟาร์ม:</label>
            <input type="text" id="name" required placeholder="เช่น ฟาร์มไก่ชน">
        </div>
        <div class="form-group">
            <label>Tag ในเกม (#):</label>
            <input type="text" id="tag" required placeholder="#XXXXXX">
        </div>
        <div class="form-group">
            <label>เลือกชนิดขนม:</label>
            <select id="item">
                <option value="ขนมปัง">ขนมปัง</option>
                <option value="เค้กช็อกโกแลต">เค้กช็อกโกแลต</option>
                <option value="คุกกี้">คุกกี้</option>
            </select>
        </div>
        <div class="form-group">
            <label>จำนวนที่ต้องการสั่ง (ชิ้น):</label>
            <input type="number" id="quantity" min="10" value="10" required oninput="calculatePrice()">
            <div class="note">* ขั้นต่ำ 10 ชิ้น</div>
        </div>

        <!-- กล่องแสดงราคาคำนวณอัตโนมัติ -->
        <div class="price-box">
            <div class="price-title">ราคารวมทั้งสิ้น</div>
            <div class="price-amount" id="displayTotal">2.00 บาท</div>
        </div>

        <button type="submit" id="submitBtn">ส่งรายการสั่งซื้อ</button>
    </form>
</div>

<script>
    // ⚠️ เอา URL Web App ที่ก๊อปปี้มาจาก Google Apps Script มาวางแทนที่ข้อความด้านล่างนี้
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzgp3FtmPRryzLiKuGqL61Pwlf27Xf7QugR5qv7SltoPo5I5RjojXmHu6AHyMa3EMpI/exec'; 

    let currentTotal = 2;

    // ฟังก์ชันคำนวณราคาอัตโนมัติ
    function calculatePrice() {
        const qtyInput = document.getElementById('quantity');
        let qty = parseInt(qtyInput.value) || 0;

        if (qty < 10) {
            document.getElementById('displayTotal').innerText = 'ขั้นต่ำ 10 ชิ้น';
            currentTotal = 0;
            return;
        }

        // คำนวณตามสัดส่วน (100 ชิ้น = 12 บาท -> ชิ้นละ 0.12 บาท)
        currentTotal = (qty * 0.12).toFixed(2);
        
        // ถ้าน้อยกว่าหรือเท่ากับ 10 ชิ้น ให้คิดขั้นต่ำ 2 บาท
        if (qty <= 10) {
            currentTotal = (2.00).toFixed(2);
        }

        document.getElementById('displayTotal').innerText = currentTotal + ' บาท';
    }

    document.getElementById('orderForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const qty = parseInt(document.getElementById('quantity').value);
        if (qty < 10) {
            alert('กรุณาสั่งอย่างน้อย 10 ชิ้นขึ้นไปครับ');
            return;
        }

        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerText = 'กำลังส่งข้อมูล...';

        const itemName = document.getElementById('item').value;
        const payload = {
            name: document.getElementById('name').value,
            tag: document.getElementById('tag').value,
            items: `${itemName} (${qty} ชิ้น)`,
            total: currentTotal
        };

        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(() => {
            alert('ส่งคำสั่งซื้อเรียบร้อยแล้ว!');
            document.getElementById('orderForm').reset();
            calculatePrice();
            btn.disabled = false;
            btn.innerText = 'ส่งรายการสั่งซื้อ';
        })
        .catch(error => {
            alert('เกิดข้อผิดพลาด ลองใหม่อีกครั้ง');
            btn.disabled = false;
            btn.innerText = 'ส่งรายการสั่งซื้อ';
        });
    });
</script>

</body>
</html>
